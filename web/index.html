<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="title" content="Fit House">
  <meta name="description" content="App per la gestione dei corsi di fitness">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fit House Monza">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=20260425">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=20260425"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=20260425"/>
  <link rel="shortcut icon" href="favicon.ico?v=20260425"/>

  <title>Fit House</title>

  <!-- Handshake anticipati verso gli host del percorso critico: engine
       (gstatic), font Roboto, Firestore, Auth e — dopo il login — OneSignal. -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://www.gstatic.com">
  <link rel="dns-prefetch" href="https://fonts.gstatic.com">
  <link rel="dns-prefetch" href="https://firestore.googleapis.com">
  <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">
  <link rel="dns-prefetch" href="https://cdn.onesignal.com">
  <link rel="manifest" href="manifest.json?v=20260714">
  
  <!-- Meta tag per impedire caching di version.json -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
    }
    
    .logo-container {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .logo {
      height: 200px;
      margin-bottom: 20px;
    }

    #splash {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Colore primario dell'app su sfondo bianco: prima era bianco su bianco. */
    .loader {
      width: 44px;
      height: 44px;
      border: 5px solid rgba(37, 99, 235, 0.2);
      border-radius: 50%;
      border-top-color: rgb(37, 99, 235);
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      margin-top: 20px;
      font-size: 1.2rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <!-- Splash HTML: visibile mentre si scaricano engine e app, rimosso al primo
       frame Flutter. Il logo è una copia ridimensionata (web/splash_logo.png,
       400 px di altezza) invece del PNG 1541x2311 del bundle. -->
  <div id="splash">
    <div class="logo-container">
      <img src="splash_logo.png" alt="Fit House" class="logo">
    </div>
    <div class="loader"></div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      const splash = document.getElementById('splash');
      if (splash) splash.remove();
    }, { once: true });
  </script>
  
  <script>
    // Version checking logic
    let currentVersion = null;
    let checkInterval = null;
    
    async function getCurrentVersion() {
      try {
        const response = await fetch('version.json?t=' + Date.now());
        const data = await response.json();
        
        return data.build_number || data.version;
      } catch (error) {
        console.error('Errore nel recupero della versione:', error);
        return null;
      }
    }
    
    // Una versione nuova rilevata mentre l'utente usa la pagina NON la
    // ricarica (un form non salvato andrebbe perso): resta in sospeso e il
    // reload avviene quando l'utente torna sulla pagina (PWA riaperta, tab
    // rimessa in primo piano).
    let updatePending = false;

    async function checkForUpdates(allowReload) {
      try {
        const serverVersion = await getCurrentVersion();
        
        if (currentVersion === null) {
          // Prima chiamata: salva la versione corrente
          currentVersion = serverVersion;
          console.log('Versione corrente:', currentVersion);
          return;
        }
        
        if (serverVersion && serverVersion !== currentVersion) {
          console.log('Nuova versione rilevata:', serverVersion, 'vs', currentVersion);
          updatePending = true;
        }

        if (updatePending && allowReload) {
          console.log('Eseguendo aggiornamento automatico...');
          forceUpdate();
        }
      } catch (error) {
        console.error('Errore nel controllo aggiornamenti:', error);
      }
    }
    
    function forceUpdate() {
      // Il service worker di Flutter 3.41 è uno stub che si auto-deregistra:
      // `navigator.serviceWorker.ready` non si risolveva e l'update restava
      // appeso. Il reload rilegge index.html; main.dart.wasm & co. possono
      // arrivare ancora dalla cache HTTP fino a 30 minuti (web/.htaccess), e in
      // quel caso l'app nuova arriva al reload successivo. Niente loop: dopo il
      // reload `currentVersion` riparte dal valore del server.
      if (window.__fitHouseReloading) return;
      window.__fitHouseReloading = true;
      window.location.reload();
    }

    function checkOnReturn() {
      if (document.visibilityState === 'visible') {
        checkForUpdates(true);
      }
    }
    
    // Inizia il controllo periodico dopo 30 secondi dall'avvio
    setTimeout(() => {
      checkForUpdates(false);
      
      // Controlla aggiornamenti ogni 5 minuti (300000 ms), senza ricaricare
      checkInterval = setInterval(() => checkForUpdates(false), 300000);
    }, 30000);
    
    // Al ritorno sulla pagina si ricarica se c'è una versione nuova
    window.addEventListener('focus', checkOnReturn);
    document.addEventListener('visibilitychange', checkOnReturn);
    
    // Controlla aggiornamenti al caricamento
    window.addEventListener('load', () => {
      setTimeout(() => checkForUpdates(false), 1000);
    });
  </script>
  
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];

    // Il SDK OneSignal non si carica più con la pagina: lo inietta la prima
    // `oneSignalInit`, che l'app chiama solo per un utente loggato su un
    // ambiente con OneSignal attivo. Il visitatore non loggato non lo scarica.
    // Le chiamate arrivate prima (login/addEmail) restano in coda su
    // `OneSignalDeferred`, che il SDK svuota al caricamento.
    function oneSignalLoadSdk() {
      if (window.__fitHouseOneSignalSdkRequested) {
        return;
      }
      window.__fitHouseOneSignalSdkRequested = true;
      const script = document.createElement('script');
      script.src = 'https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js';
      script.defer = true;
      script.onerror = function() {
        console.error('[OneSignal Web] caricamento SDK fallito');
      };
      document.head.appendChild(script);
    }

    function fitHouseBasePath() {
      const baseElement = document.querySelector('base');
      const rawBase = baseElement ? (baseElement.getAttribute('href') || '/') : '/';
      const resolvedBase = new URL(rawBase, window.location.origin).pathname;
      return resolvedBase.endsWith('/') ? resolvedBase : resolvedBase + '/';
    }

    function fitHouseScopedPath(path) {
      return fitHouseBasePath() + path;
    }

    function withOneSignal(action, label) {
      const initPromise = window.__fitHouseOneSignalInitPromise || Promise.resolve();
      initPromise.then(() => {
        window.OneSignalDeferred.push(async function(OneSignal) {
          try {
            await action(OneSignal);
          } catch (error) {
            console.error('[OneSignal Web] ' + label + ' error:', error);
          }
        });
      });
    }

    window.oneSignalInit = function(appId) {
      if (window.__fitHouseOneSignalInitPromise) {
        return;
      }

      // La promise va creata PRIMA di caricare il SDK: `withOneSignal` la usa
      // per accodare login/addEmail dietro l'init.
      window.__fitHouseOneSignalInitPromise = new Promise((resolve) => {
        window.OneSignalDeferred.push(async function(OneSignal) {
          try {
            if (!OneSignal.Notifications.isPushSupported()) {
              console.info('[OneSignal Web] Push non supportate da questo browser');
              resolve();
              return;
            }

            const workerScope = fitHouseScopedPath('push/onesignal/');
            const workerPath = workerScope + 'OneSignalSDKWorker.js';
            console.info('[OneSignal Web] init config:', {
              workerPath: workerPath,
              workerScope: workerScope,
            });

            await OneSignal.init({
              appId: appId,
              serviceWorkerPath: workerPath,
              serviceWorkerParam: {
                scope: workerScope,
              },
            });
          } catch (error) {
            console.error('[OneSignal Web] init error:', error, String(error));
          }

          resolve();
        });
      });
      oneSignalLoadSdk();
    };

    window.oneSignalLogin = function(userId) {
      withOneSignal(async function(OneSignal) {
        await OneSignal.login(userId);
      }, 'login');
    };

    window.oneSignalLogout = function() {
      withOneSignal(async function(OneSignal) {
        await OneSignal.logout();
      }, 'logout');
    };

    window.oneSignalAddEmail = function(email) {
      withOneSignal(async function(OneSignal) {
        await OneSignal.User.addEmail(email);
      }, 'addEmail');
    };

    window.oneSignalRemoveEmail = function(email) {
      withOneSignal(async function(OneSignal) {
        await OneSignal.User.removeEmail(email);
      }, 'removeEmail');
    };

    window.oneSignalSyncPushPreference = function(enabled) {
      withOneSignal(async function(OneSignal) {
        if (!OneSignal.Notifications.isPushSupported()) {
          return;
        }

        if (enabled) {
          if (OneSignal.Notifications.permission === true) {
            await OneSignal.User.PushSubscription.optIn();
          }
          return;
        }

        await OneSignal.User.PushSubscription.optOut();
      }, 'syncPushPreference');
    };

    window.oneSignalSetPushEnabled = function(enabled) {
      withOneSignal(async function(OneSignal) {
        if (!OneSignal.Notifications.isPushSupported()) {
          return;
        }

        if (enabled) {
          await OneSignal.User.PushSubscription.optIn();
          return;
        }

        await OneSignal.User.PushSubscription.optOut();
      }, 'setPushEnabled');
    };

    window.oneSignalHasPushPermission = function() {
      if (!window.Notification) {
        return false;
      }

      return Notification.permission === 'granted';
    };

    window.oneSignalCanRequestPushPermission = function() {
      if (!window.Notification) {
        return false;
      }

      return Notification.permission === 'default';
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
