<!DOCTYPE html>
<html>
<head>

    This is a placeholder for base href that will be replaced by the value of

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="title" content="Fit House">
  <meta name="description" content="App per la gestione dei corsi di fitness">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fit House Monza">
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=20260425">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="favicon.png?v=20260425"/>
  <link rel="icon" type="image/x-icon" href="favicon.ico?v=20260425"/>
  <link rel="shortcut icon" href="favicon.ico?v=20260425"/>

  <title>Fit House</title>
  <link rel="manifest" href="manifest.json?v=20260714">
  
  <!-- Meta tag per impedire caching di version.json -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: white;
    }
    
    .logo-container {
      text-align: center;
      margin-bottom: 30px;
    }
    
    .logo {
      
      height: 200px;
      margin-bottom: 20px;
    }
    
    .loader {
      width: 50px;
      height: 50px;
      border: 5px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 1s ease-in-out infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .loading-text {
      margin-top: 20px;
      font-size: 1.2rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>
  <div class="logo-container">
    <img src="assets/assets/new_logo_only.png" alt="Fit House" class="logo">
  </div>
  
  <div class="loader"></div>
  
  <script>
    // Version checking logic
    let currentVersion = null;
    let checkInterval = null;
    
    async function getCurrentVersion() {
      try {
        const response = await fetch('version.json?t=' + Date.now());
        const data = await response.json();
        
        return data.build_number || data.version;
      } catch (error) {
        console.error('Errore nel recupero della versione:', error);
        return null;
      }
    }
    
    async function checkForUpdates() {
      try {
        const serverVersion = await getCurrentVersion();
        
        if (currentVersion === null) {
          // Prima chiamata: salva la versione corrente
          currentVersion = serverVersion;
          console.log('Versione corrente:', currentVersion);
          return;
        }
        
        if (serverVersion && serverVersion !== currentVersion) {
          console.log('Nuova versione rilevata:', serverVersion, 'vs', currentVersion);
          console.log('Eseguendo aggiornamento automatico...');
          forceUpdate();
        }
      } catch (error) {
        console.error('Errore nel controllo aggiornamenti:', error);
      }
    }
    
    async function forceUpdate() {
      try {
        // Registra il service worker se disponibile
        if ('serviceWorker' in navigator) {
          const registration = await navigator.serviceWorker.ready;
          
          // Invia messaggio al service worker per forzare l'aggiornamento
          if (registration.active) {
            registration.active.postMessage('skipWaiting');
          }
          
          // Forza il reload della pagina
          window.location.reload(true);
        } else {
          // Fallback: semplice reload
          window.location.reload(true);
        }
      } catch (error) {
        console.error('Errore nell\'aggiornamento:', error);
        // Fallback: semplice reload
        window.location.reload(true);
      }
    }
    
    // Inizia il controllo periodico dopo 30 secondi dall'avvio
    setTimeout(() => {
      checkForUpdates();
      
      // Controlla aggiornamenti ogni 5 minuti (300000 ms)
      checkInterval = setInterval(checkForUpdates, 300000);
    }, 30000);
    
    // Controlla aggiornamenti al focus della finestra
    window.addEventListener('focus', checkForUpdates);
    
    // Controlla aggiornamenti al caricamento
    window.addEventListener('load', () => {
      setTimeout(checkForUpdates, 1000);
    });
  </script>
  
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];

    function fitHouseBasePath() {
      const baseElement = document.querySelector('base');
      const rawBase = baseElement ? (baseElement.getAttribute('href') || '/') : '/';
      const resolvedBase = new URL(rawBase, window.location.origin).pathname;
      return resolvedBase.endsWith('/') ? resolvedBase : resolvedBase + '/';
    }

    function fitHouseScopedPath(path) {
      return fitHouseBasePath() + path;
    }

    // Timeout di sicurezza: se il CDN di OneSignal non carica, i callback di
    // `OneSignalDeferred` non vengono mai eseguiti e la Promise non si
    // risolverebbe mai — un `await` Dart resterebbe appeso per sempre (il caso
    // che fa piu' male e' `signOut`). Meglio un fallback esplicito.
    var FIT_HOUSE_ONESIGNAL_TIMEOUT_MS = 10000;

    function fitHouseSettle(promise, fallback, label) {
      return new Promise(function(resolve) {
        var settled = false;
        function done(value) {
          if (settled) return;
          settled = true;
          clearTimeout(timer);
          resolve(value);
        }
        var timer = setTimeout(function() {
          console.warn('[OneSignal Web] ' + label + ': SDK non pronto entro il timeout');
          done(fallback);
        }, FIT_HOUSE_ONESIGNAL_TIMEOUT_MS);
        promise.then(done, function(error) {
          console.error('[OneSignal Web] ' + label + ' error:', error);
          done(fallback);
        });
      });
    }

    // Ogni funzione del bridge RITORNA una Promise che risolve *sempre*, anche
    // in errore: i wrapper Dart fanno `.toDart` e un reject non gestito
    // arriverebbe come eccezione Dart dentro `saveChanges`/`signOut`. Prima
    // erano tutte fire-and-forget, quindi ogni `await` lato Dart era finto.
    function withOneSignal(action, label, fallback) {
      var initPromise = window.__fitHouseOneSignalInitPromise || Promise.resolve();
      var chained = initPromise.then(function() {
        return new Promise(function(resolve, reject) {
          window.OneSignalDeferred.push(async function(OneSignal) {
            try {
              resolve(await action(OneSignal));
            } catch (error) {
              reject(error);
            }
          });
        });
      });
      return fitHouseSettle(chained, fallback, label);
    }

    /** true se il permesso notifiche e' concesso adesso. */
    function fitHousePushGranted(OneSignal) {
      if (OneSignal && OneSignal.Notifications &&
          OneSignal.Notifications.permission === true) {
        return true;
      }
      return !!window.Notification && Notification.permission === 'granted';
    }

    /** optIn solo a permesso concesso. Ritorna true se il device e' iscritto. */
    async function fitHouseOptInIfGranted(OneSignal) {
      if (!fitHousePushGranted(OneSignal)) return false;
      try {
        await OneSignal.User.PushSubscription.optIn();
        return true;
      } catch (error) {
        console.error('[OneSignal Web] optIn error:', error);
        return false;
      }
    }

    window.oneSignalInit = function(appId) {
      if (window.__fitHouseOneSignalInitPromise) {
        return window.__fitHouseOneSignalInitPromise;
      }

      window.__fitHouseOneSignalInitPromise = new Promise((resolve) => {
        window.OneSignalDeferred.push(async function(OneSignal) {
          try {
            if (!OneSignal.Notifications.isPushSupported()) {
              console.info('[OneSignal Web] Push non supportate da questo browser');
              resolve();
              return;
            }

            const workerScope = fitHouseScopedPath('push/onesignal/');
            const workerPath = workerScope + 'OneSignalSDKWorker.js';
            console.info('[OneSignal Web] init config:', {
              workerPath: workerPath,
              workerScope: workerScope,
            });

            await OneSignal.init({
              appId: appId,
              serviceWorkerPath: workerPath,
              serviceWorkerParam: {
                scope: workerScope,
              },
            });
          } catch (error) {
            console.error('[OneSignal Web] init error:', error, String(error));
          }

          resolve();
        });
      });

      return window.__fitHouseOneSignalInitPromise;
    };

    /** Risolve quando l'init e' completata (o subito, se non e' mai partita). */
    window.oneSignalWhenReady = function() {
      return fitHouseSettle(
        window.__fitHouseOneSignalInitPromise || Promise.resolve(),
        undefined,
        'whenReady'
      );
    };

    window.oneSignalLogin = function(userId) {
      return withOneSignal(async function(OneSignal) {
        await OneSignal.login(userId);
      }, 'login', undefined);
    };

    window.oneSignalLogout = function() {
      return withOneSignal(async function(OneSignal) {
        await OneSignal.logout();
      }, 'logout', undefined);
    };

    window.oneSignalAddEmail = function(email) {
      return withOneSignal(async function(OneSignal) {
        await OneSignal.User.addEmail(email);
      }, 'addEmail', undefined);
    };

    window.oneSignalRemoveEmail = function(email) {
      return withOneSignal(async function(OneSignal) {
        await OneSignal.User.removeEmail(email);
      }, 'removeEmail', undefined);
    };

    window.oneSignalSyncPushPreference = function(enabled) {
      return withOneSignal(async function(OneSignal) {
        if (!OneSignal.Notifications.isPushSupported()) {
          return;
        }

        if (enabled) {
          await fitHouseOptInIfGranted(OneSignal);
          return;
        }

        await OneSignal.User.PushSubscription.optOut();
      }, 'syncPushPreference', undefined);
    };

    /**
     * Applica la preferenza push SENZA chiedere il permesso: l'opt-in richiede
     * un gesto utente e passa da `oneSignalRequestPushPermission`. Qui resta
     * l'opt-out (che un gesto non lo richiede) e il ri-opt-in a permesso gia'
     * concesso. Ritorna lo stato effettivo del device.
     */
    window.oneSignalSetPushEnabled = function(enabled) {
      return withOneSignal(async function(OneSignal) {
        if (!OneSignal.Notifications.isPushSupported()) {
          return false;
        }

        if (enabled) {
          return await fitHouseOptInIfGranted(OneSignal);
        }

        await OneSignal.User.PushSubscription.optOut();
        return false;
      }, 'setPushEnabled', false);
    };

    /**
     * Chiede il permesso notifiche e, se concesso, iscrive il device.
     *
     * `requestPermission()` viene invocata in modo **sincrono** rispetto al tap:
     * NON passa da `withOneSignal` (che incatenerebbe `initPromise.then` +
     * `OneSignalDeferred`, cioe' >= 3 turni di event loop). Su WebKit la
     * transient activation si perde al primo await e il prompt iOS non compare.
     * Il fallback asincrono serve solo quando l'SDK non e' ancora caricato:
     * meglio un prompt che non compare su iOS che nessun prompt altrove.
     */
    window.oneSignalRequestPushPermission = function() {
      var OneSignal = window.OneSignal;
      var notifications = OneSignal && OneSignal.Notifications;
      if (!notifications || typeof notifications.requestPermission !== 'function') {
        console.warn('[OneSignal Web] requestPushPermission: SDK non pronto, fallback asincrono');
        return withOneSignal(async function(OneSignal) {
          await OneSignal.Notifications.requestPermission();
          return await fitHouseOptInIfGranted(OneSignal);
        }, 'requestPushPermission', false);
      }

      var requested;
      try {
        requested = notifications.requestPermission();
      } catch (error) {
        console.error('[OneSignal Web] requestPushPermission error:', error);
        return Promise.resolve(false);
      }

      return fitHouseSettle(
        Promise.resolve(requested).then(function() {
          return fitHouseOptInIfGranted(OneSignal);
        }),
        false,
        'requestPushPermission'
      );
    };

    /**
     * Stato push del dispositivo, sincrono e indipendente dall'SDK: serve a
     * decidere se e quale banner mostrare prima ancora che OneSignal sia
     * pronto.
     */
    window.oneSignalPushEnvironment = function() {
      var nav = window.navigator || {};
      // iPadOS >= 13 manda uno UA da Mac: il tell e' il touch screen.
      var ios = /iPad|iPhone|iPod/.test(nav.platform || '') ||
        (nav.platform === 'MacIntel' && (nav.maxTouchPoints || 0) > 1);
      // `navigator.standalone` e' l'unico segnale affidabile su iOS < 16.4;
      // `display-mode` copre gli altri browser. Servono entrambi, in OR.
      var standalone = nav.standalone === true ||
        (typeof window.matchMedia === 'function' &&
          window.matchMedia('(display-mode: standalone)').matches);
      // Anche PushManager, non solo Notification: su iOS in tab Safari la Web
      // Push API non esiste affatto.
      var hasApi = typeof window.Notification !== 'undefined' &&
        typeof window.PushManager !== 'undefined' &&
        'serviceWorker' in nav;
      return {
        hasApi: hasApi,
        permission: hasApi ? Notification.permission : 'unsupported',
        ios: ios === true,
        standalone: standalone === true,
      };
    };

    /**
     * Helper di debug da console (`await oneSignalDiagnostics()`): dice se il
     * device e' davvero iscritto e con quale scope e' registrato il worker.
     * Non viene chiamata dal codice Dart.
     */
    window.oneSignalDiagnostics = function() {
      return withOneSignal(async function(OneSignal) {
        var registrations = navigator.serviceWorker
          ? await navigator.serviceWorker.getRegistrations()
          : [];
        return {
          environment: window.oneSignalPushEnvironment(),
          optedIn: OneSignal.User.PushSubscription.optedIn,
          subscriptionId: OneSignal.User.PushSubscription.id,
          hasToken: !!OneSignal.User.PushSubscription.token,
          serviceWorkerScopes: registrations.map(function(r) { return r.scope; }),
        };
      }, 'diagnostics', null);
    };
  </script>

  <script src="flutter_bootstrap.js" async></script>
