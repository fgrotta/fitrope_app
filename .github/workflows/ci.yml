name: CI

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_LOGLEVEL: error

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true
          pub-cache: true
      
      - name: Install dependencies
        run: flutter pub get
        
      - name: Run tests
        run: flutter test
        
      - name: Run analysis
        run: flutter analyze --no-fatal-infos
        
      - name: Check formatting
        run: dart format --set-exit-if-changed .
        
      - name: Build Web (dry run, valida il path --wasm di produzione)
        run: flutter build web --wasm --release

  functions-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build (tsc)
        working-directory: functions
        run: npm run build

      - name: Run Cloud Functions tests
        working-directory: functions
        run: npm test

  functions-integration:
    # Categoria C del piano: test d'integrazione sulle callable enrollment
    # contro la Firebase Emulator Suite reale (transazioni, atomicità,
    # concorrenza/contention). Project demo-* = offline-only, nessuna credenziale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java (richiesto dall'emulatore Firestore)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Configure emulator secrets
        working-directory: functions
        run: printf "ONESIGNAL_REST_API_KEY=emulator-dummy-key\n" > .secret.local

      - name: Run integration tests on Emulator Suite
        working-directory: functions
        run: npm run test:integration

  flutter-e2e-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: stable
          cache: true
          pub-cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: nanasess/setup-chromedriver@v2
      - run: npm install -g firebase-tools@15
      - run: flutter pub get
      - working-directory: functions
        run: npm ci && npm run build
      - name: Configure emulator secrets
        working-directory: functions
        run: printf "ONESIGNAL_REST_API_KEY=emulator-dummy-key\n" > .secret.local
      - name: Run critical Flutter E2E against Emulator Suite
        shell: bash
        run: |
          set -euo pipefail
          TEST_NAMESPACE="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          SIGNUP_EMAIL="e2e.signup+${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}@example.com"
          SIGNUP_PASSWORD="test1234"

          firebase emulators:start --only auth,firestore,functions \
            --project fit-rope-app-1f575 > /tmp/firebase-emulators.log 2>&1 &
          emulator_pid=$!
          chromedriver --port=4444 > /tmp/chromedriver.log 2>&1 &
          chromedriver_pid=$!

          cleanup() {
            npm --prefix functions run e2e:admin -- delete-signup \
              --email "$SIGNUP_EMAIL" --emulator || true
            npm --prefix functions run e2e:admin -- cleanup-enrollment-matrix \
              --namespace "$TEST_NAMESPACE" --emulator || true
            npm --prefix functions run e2e:admin -- cleanup-courses \
              --namespace "$TEST_NAMESPACE" --emulator || true
            kill "$chromedriver_pid" "$emulator_pid" 2>/dev/null || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:4000 >/dev/null 2>&1; then break; fi
            if [ "$attempt" = 60 ]; then
              cat /tmp/firebase-emulators.log
              exit 1
            fi
            sleep 2
          done
          npm --prefix functions run seed:emulator
          npm --prefix functions run e2e:admin -- prepare-enrollment-matrix \
            --namespace "$TEST_NAMESPACE" --emulator

          drive() {
            local target="$1"
            shift
            flutter drive --no-pub \
              --driver=test_driver/integration_test.dart \
              --target="$target" -d chrome \
              --browser-dimension=1200x900 \
              --dart-define=USE_EMULATOR=true \
              --dart-define=TEST_RUN_NAMESPACE="$TEST_NAMESPACE" \
              --dart-define-from-file=integration_test/test_env.emulator.json \
              "$@"
          }

          drive integration_test/login_test.dart
          drive integration_test/role_navigation_test.dart
          drive integration_test/subscribe_to_course_test.dart
          drive integration_test/waitlist_swap_test.dart
          drive integration_test/subscription_limits_test.dart
          drive integration_test/waitlist_subscription_matrix_test.dart
          drive integration_test/course_management_test.dart
          drive integration_test/registration_unverified_test.dart \
            --dart-define=SIGNUP_TEST_EMAIL="$SIGNUP_EMAIL" \
            --dart-define=SIGNUP_TEST_PASSWORD="$SIGNUP_PASSWORD"
          npm --prefix functions run e2e:admin -- verify-signup \
            --email "$SIGNUP_EMAIL" --emulator
          drive integration_test/registration_verified_login_test.dart \
            --dart-define=SIGNUP_TEST_EMAIL="$SIGNUP_EMAIL" \
            --dart-define=SIGNUP_TEST_PASSWORD="$SIGNUP_PASSWORD"
