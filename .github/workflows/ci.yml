name: CI

on:
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_LOGLEVEL: error

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.6'
          channel: 'stable'
          cache: true
          pub-cache: true
      
      - name: Install dependencies
        run: flutter pub get
        
      - name: Run tests
        run: flutter test
        
      - name: Run analysis
        run: flutter analyze --no-fatal-infos
        
      - name: Check formatting
        run: dart format --set-exit-if-changed .
        
      # dart2js e non --wasm: con --wasm i `deferred as` non producono moduli
      # separati e il codice admin finirebbe nel bundle di tutti.
      - name: Build Web (dry run, stesso path della produzione)
        run: flutter build web --release

      # Gate anti-regressione del conditional export di onesignal_service.dart:
      # una direttiva scritta male compila il ramo *mobile* sul web
      # (MissingPluginException a runtime, niente push ne' alias email); sotto
      # --wasm succedeva con `dart.library.html`. Il marcatore e' il debugPrint
      # del ramo web: il ramo mobile stampa invece "[OneSignal]" senza " Web".
      - name: Verifica che il bundle contenga il ramo web di OneSignal
        run: grep -q 'OneSignal Web' build/web/main.dart.js

  functions-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Build (tsc)
        working-directory: functions
        run: npm run build

      - name: Run Cloud Functions tests
        working-directory: functions
        run: npm test

  functions-integration:
    # Categoria C del piano: test d'integrazione sulle callable enrollment
    # contro la Firebase Emulator Suite reale (transazioni, atomicità,
    # concorrenza/contention). Project demo-* = offline-only, nessuna credenziale.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Setup Java (richiesto dall'emulatore Firestore)
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install firebase-tools
        run: npm install -g firebase-tools@15

      - name: Install Cloud Functions dependencies
        working-directory: functions
        run: npm ci

      - name: Configure emulator secrets
        working-directory: functions
        run: printf "ONESIGNAL_REST_API_KEY=emulator-dummy-key\n" > .secret.local

      - name: Run integration tests on Emulator Suite
        working-directory: functions
        run: npm run test:integration
