name: Staging Deploy

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pages: write

concurrency:
  group: staging-deploy
  cancel-in-progress: true

env:
  STAGING_PROJECT_ID: ${{ vars.FIREBASE_STAGING_PROJECT_ID }}

jobs:
  flutter-test-and-build:
    runs-on: ubuntu-latest
    # Necessario come per i job di deploy: le vars FIREBASE_STAGING_* usate qui
    # sotto possono essere definite a livello di environment, e senza questa
    # riga arriverebbero vuote alla build.
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze --no-fatal-infos
      - run: dart format --set-exit-if-changed .
      - name: Validate staging Firebase configuration
        env:
          FIREBASE_API_KEY: ${{ vars.FIREBASE_STAGING_API_KEY }}
          FIREBASE_APP_ID: ${{ vars.FIREBASE_STAGING_APP_ID }}
          FIREBASE_MESSAGING_SENDER_ID: ${{ vars.FIREBASE_STAGING_MESSAGING_SENDER_ID }}
          FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_STAGING_PROJECT_ID }}
          FIREBASE_AUTH_DOMAIN: ${{ vars.FIREBASE_STAGING_AUTH_DOMAIN }}
          FIREBASE_STORAGE_BUCKET: ${{ vars.FIREBASE_STAGING_STORAGE_BUCKET }}
          FIREBASE_MEASUREMENT_ID: ${{ vars.FIREBASE_STAGING_MEASUREMENT_ID }}
        run: |
          test -n "$FIREBASE_API_KEY"
          test -n "$FIREBASE_APP_ID"
          test -n "$FIREBASE_MESSAGING_SENDER_ID"
          test -n "$FIREBASE_PROJECT_ID"
          test -n "$FIREBASE_AUTH_DOMAIN"
          test -n "$FIREBASE_STORAGE_BUCKET"
      - name: Build staging web
        run: >-
          flutter build web --wasm --release --base-href /fitrope_app/
          --dart-define=APP_ENV=staging
          --dart-define=FIREBASE_API_KEY=${{ vars.FIREBASE_STAGING_API_KEY }}
          --dart-define=FIREBASE_APP_ID=${{ vars.FIREBASE_STAGING_APP_ID }}
          --dart-define=FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_STAGING_MESSAGING_SENDER_ID }}
          --dart-define=FIREBASE_PROJECT_ID=${{ vars.FIREBASE_STAGING_PROJECT_ID }}
          --dart-define=FIREBASE_AUTH_DOMAIN=${{ vars.FIREBASE_STAGING_AUTH_DOMAIN }}
          --dart-define=FIREBASE_STORAGE_BUCKET=${{ vars.FIREBASE_STAGING_STORAGE_BUCKET }}
          --dart-define=FIREBASE_MEASUREMENT_ID=${{ vars.FIREBASE_STAGING_MEASUREMENT_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  functions-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: functions
        run: npm ci
      - working-directory: functions
        run: npm run build
      - working-directory: functions
        run: npm test -- --runInBand

  functions-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install -g firebase-tools@15
      - working-directory: functions
        run: npm ci
      - working-directory: functions
        env:
          ONESIGNAL_REST_API_KEY: emulator-dummy-key
        run: npm run test:integration

  deploy-functions:
    needs: [flutter-test-and-build, functions-test, functions-integration]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: npm install -g firebase-tools@15
      - working-directory: functions
        run: npm ci
      - name: Configure Functions staging runtime
        working-directory: functions
        env:
          ONESIGNAL_APP_ID: ${{ vars.ONESIGNAL_APP_ID }}
          STAGING_NOTIFICATION_EMAIL_ALLOWLIST: ${{ vars.STAGING_NOTIFICATION_EMAIL_ALLOWLIST }}
        run: |
          test -n "$ONESIGNAL_APP_ID"
          test -n "$STAGING_NOTIFICATION_EMAIL_ALLOWLIST"
          printf "APP_ENV=staging\nONESIGNAL_APP_ID=%s\nSTAGING_NOTIFICATION_EMAIL_ALLOWLIST=%s\n" \
            "$ONESIGNAL_APP_ID" "$STAGING_NOTIFICATION_EMAIL_ALLOWLIST" > ".env.$STAGING_PROJECT_ID"
      - name: Deploy Functions staging
        run: firebase deploy --project "$STAGING_PROJECT_ID" --only functions --non-interactive
      - name: Seed staging data
        working-directory: functions
        run: npm run seed:staging

  deploy-pages:
    needs: deploy-functions
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  deploy-rules:
    needs: deploy-pages
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: npm install -g firebase-tools@15
      - name: Deploy Firestore Rules staging
        run: firebase deploy --project "$STAGING_PROJECT_ID" --only firestore:rules --non-interactive

  # Step 9 del PIANO_STAGING: smoke test di sito e callable dopo il deploy.
  # Verifica che la PWA risponda e che tutte le callable enrollment esistano
  # davvero sul progetto staging — un deploy Functions parziale altrimenti
  # passerebbe silenziosamente e romperebbe l'app solo al primo click.
  smoke-test:
    needs: [deploy-pages, deploy-rules]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_STAGING_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - run: npm install -g firebase-tools@15
      - name: Smoke test sito staging
        env:
          PAGE_URL: ${{ needs.deploy-pages.outputs.page_url }}
        run: |
          test -n "$PAGE_URL"
          # index.html e i due file che il service worker usa per il versioning.
          for path in "" "version.json" "flutter_bootstrap.js"; do
            echo "GET ${PAGE_URL}${path}"
            curl -fsS --retry 5 --retry-delay 5 --retry-all-errors \
              -o /dev/null "${PAGE_URL}${path}"
          done
      - name: Smoke test callable staging
        run: |
          firebase functions:list --project "$STAGING_PROJECT_ID" --json > functions.json
          # grep sul nome nudo: firebase puo prefissare la regione nell'id
          # (europe-west8-subscribeToCourse), quindi non ancorare alle virgolette.
          for fn in subscribeToCourse unsubscribeFromCourse joinWaitlist \
                    leaveWaitlist assignSubscription deleteCourse \
                    recountCourseSubscribed sendOneSignalNotification; do
            if ! grep -q "$fn" functions.json; then
              echo "::error::callable mancante su staging: $fn"
              exit 1
            fi
            echo "ok: $fn"
          done
