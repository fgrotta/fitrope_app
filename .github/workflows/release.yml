name: Release Validation

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"
  NPM_CONFIG_LOGLEVEL: error

# Production remains a manual Hostinger deployment. GitHub Pages is reserved
# for staging and is deployed exclusively by staging.yml from develop.
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
          cache: true
          pub-cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze --no-fatal-infos
      - run: dart format --set-exit-if-changed .
      - run: flutter build web --wasm --release

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - working-directory: functions
        run: npm ci
      - working-directory: functions
        run: npm run build
      - working-directory: functions
        run: npm test -- --runInBand

  # Stesso gate di ci.yml: il branch release non puo essere piu permissivo di
  # main. Le callable enrollment sono il codice piu critico e le transazioni si
  # verificano solo contro la Emulator Suite reale.
  functions-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install -g firebase-tools@15
      - working-directory: functions
        run: npm ci
      - name: Configure emulator secrets
        working-directory: functions
        run: printf "ONESIGNAL_REST_API_KEY=emulator-dummy-key\n" > .secret.local
      - working-directory: functions
        run: npm run test:integration
