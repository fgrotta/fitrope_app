name: Release Validation

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

# Production remains a manual Hostinger deployment. GitHub Pages is reserved
# for staging and is deployed exclusively by staging.yml from develop.
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze --no-fatal-infos
      - run: flutter build web --wasm --release

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: functions
        run: npm ci
      - working-directory: functions
        run: npm run build
      - working-directory: functions
        run: npm test -- --runInBand
