name: Release Validation

on:
  push:
    branches: [release]
  pull_request:
    branches: [release]

# Production remains a manual Hostinger deployment. GitHub Pages is reserved
# for staging and is deployed exclusively by staging.yml from develop.
jobs:
  validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.6"
          channel: stable
      - run: flutter pub get
      - run: flutter test
      - run: flutter analyze --no-fatal-infos
      - run: dart format --set-exit-if-changed .
      - run: flutter build web --wasm --release

  functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: functions
        run: npm ci
      - working-directory: functions
        run: npm run build
      - working-directory: functions
        run: npm test -- --runInBand

  # Stesso gate di ci.yml: il branch release non puo essere piu permissivo di
  # main. Le callable enrollment sono il codice piu critico e le transazioni si
  # verificano solo contro la Emulator Suite reale.
  functions-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Java (richiesto dall'emulatore Firestore)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install -g firebase-tools@15
      - working-directory: functions
        run: npm ci
      - working-directory: functions
        env:
          # Secret fittizio per defineSecret nell'emulatore (notifiche best-effort).
          ONESIGNAL_REST_API_KEY: emulator-dummy-key
        run: npm run test:integration
