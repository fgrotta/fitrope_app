name: fitrope_app
description: "Fitrope App"
publish_to: 'none'

version: 1.1.3

environment:
  sdk: '>=3.5.0-180.3.beta <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  flutter_design_system:
    git:
      url: https://github.com/dellarosamarco/flutter_design_system.git
      ref: main
  redux_thunk: ^0.4.0
  redux: ^5.0.0
  flutter_redux: ^0.10.0
  url_launcher: ^6.2.6
  intl: ^0.20.2
  onesignal_flutter: ^5.2.7
  http: ^1.2.2
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true

  # Elenco esplicito dei soli asset usati a runtime (evita di impacchettare i
  # logo non referenziati: Logo_old.png, Logo.png/svg, logo_only_square*.png —
  # questi ultimi sono input build-time di flutter_launcher_icons, letti dal
  # path, NON bundlati).
  assets:
    - assets/new_logo_only.png
    - assets/new_logo.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path_ios: "assets/logo_only_square_white.png"
  image_path: "assets/logo_only_square.png"  
  min_sdk_android: 21