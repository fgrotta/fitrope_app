name: fitrope_app
description: "Fitrope App"
publish_to: 'none'

version: 1.3.0

environment:
  sdk: '>=3.5.0-180.3.beta <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  cloud_functions: ^5.1.3
  flutter_design_system:
    git:
      url: https://github.com/dellarosamarco/flutter_design_system.git
      ref: main
  redux_thunk: ^0.4.0
  redux: ^5.0.0
  flutter_redux: ^0.10.0
  url_launcher: ^6.3.2
  intl: ^0.20.2
  onesignal_flutter: ^5.2.7
  timezone: ^0.9.4
  # Promossa da transitiva a diretta: `download_file_web.dart` usa Blob / URL /
  # HTMLAnchorElement tipizzati. Già a 1.1.1 nel pubspec.lock, la risoluzione
  # non cambia.
  web: ^1.1.1
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  fake_cloud_firestore: ^3.1.0

flutter:
  uses-material-design: true

  # Elenco esplicito degli asset usati a runtime. Le immagini dei corsi sono
  # caricate dinamicamente da CourseImages e devono quindi restare nel bundle;
  # i logo legacy restano esclusi e sono solo input di flutter_launcher_icons.
  assets:
    - assets/new_logo_only.png
    - assets/new_logo.png
    - assets/course_images/
    # Guida Admin: Markdown + immagini generate da scripts/guida_screenshots.sh.
    # Flutter non include le sottocartelle da sole: una riga per guida (lo
    # verifica test/guide_catalog_test.dart). Su web si scaricano on-demand.
    - assets/guida/
    - assets/guida/img/registrazione-utente/
    - assets/guida/img/gestione-utente/
    - assets/guida/img/simula-utente/
    - assets/guida/img/abbonamenti/
    - assets/guida/img/pacchetti-ingressi/
    - assets/guida/img/migrazione-utente-legacy/
    - assets/guida/img/corsi/
    - assets/guida/img/iscrivere-socio-a-corso/
    - assets/guida/img/presenze/
    - assets/guida/img/correggi-conteggio/
    - assets/guida/img/home-e-dashboard/
    - assets/guida/img/problemi-app/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path_ios: "assets/logo_only_square_white.png"
  image_path: "assets/logo_only_square.png"  
  min_sdk_android: 21